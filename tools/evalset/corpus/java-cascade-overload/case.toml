id = "java-cascade-overload"
language = "java"
category = "cascade"
title = "Store the currency of each order"
description = "OrderRepository.save takes the currency of the order, and the checkout request carries it. The one-argument save stays for existing callers and stores EUR, the shop's original currency."

[[issue]]
