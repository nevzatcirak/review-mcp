name: release

# Runs when a version tag is pushed. A tag with a pre-release suffix
# (for example v1.0.0-rc.1) is published as a GitHub pre-release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check third-party license bundle
        run: make licenses-check

      - name: Test
        run: go test -race ./...

      # Fails the release when CHANGELOG.md has no non-empty section for the tag.
      # The file lives outside dist/ because GoReleaser's --clean wipes dist/.
      - name: Extract release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: GoReleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # The npm job packages the binaries built by GoReleaser in this job.
      - name: Upload dist for the npm publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  # Publishes the npm packages (six platform packages, then the main package).
  # It runs only after the GitHub release and the provenance attestation
  # succeeded. Authentication is npm trusted publishing: the npm CLI exchanges
  # this job's GitHub OIDC token for a short-lived publish credential, so no
  # npm token is stored anywhere. Each of the seven packages has a trusted
  # publisher configured on npmjs.com (see docs/release.md). setup-node needs
  # no registry-url and the job sets no NODE_AUTH_TOKEN: npm defaults to
  # registry.npmjs.org and obtains its credential through OIDC. A version that
  # already exists on the registry fails the publish step and stops the job:
  # there is no force and no unpublish logic.
  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and --provenance
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      # Trusted publishing needs npm 11.5.1 or later; the version is pinned.
      - name: Install npm 11.21.0
        run: npm install -g npm@11.21.0 && npm --version

      - name: Download dist from the release job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: npm unit tests
        run: node --test "npm/test/*.test.mjs"

      - name: Build the npm packages from the tag
        run: node npm/scripts/build-packages.mjs "$GITHUB_REF_NAME" --dist dist --out npm/build

      - name: Publish (platform packages first, then the main package)
        run: node npm/scripts/publish-packages.mjs npm/build
