name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check for case-insensitive path collisions
        run: sh scripts/check-case-collisions.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Check third-party license bundle
        run: make licenses-check
      - name: Test release-notes extraction
        run: sh scripts/release-notes_test.sh

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean
      - name: Check the snapshot binary reports the snapshot version
        run: sh scripts/check-snapshot-version.sh dist
      - name: Upload the snapshot output for the npm smoke test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  # Builds the npm packages from the snapshot output and checks them on each
  # operating system: install with --ignore-scripts into an empty directory,
  # run the launcher, and do an MCP initialize -> tools/list round trip.
  # Nothing is published here.
  npm-smoke:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Download the snapshot output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshot-dist
          path: dist
      - name: npm unit tests (launcher, builder, publish logic)
        run: node --test "npm/test/*.test.mjs"
      - name: Build the npm packages from the snapshot output
        shell: bash
        run: |
          version=$(node -p "require('./dist/metadata.json').version")
          node npm/scripts/build-packages.mjs "$version" --dist dist --out npm/build
      - name: Pack, install with --ignore-scripts, run the launcher, MCP round trip
        run: node npm/scripts/smoke.mjs npm/build "${{ runner.temp }}/npm-smoke"
