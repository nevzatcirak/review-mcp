kind = "cascade"
path = "src/main/java/com/example/shop/subscription/RenewalJob.java"
lines = [34, 39]
hops = 2
must_mention = ["RenewalJob", "renew", "currency", "EUR"]
summary = "RenewalJob.renew still calls OrderService.place(cart), whose unchanged body uses the one-argument save; every renewal is stored as EUR, even for a subscription billed in USD or GBP."
